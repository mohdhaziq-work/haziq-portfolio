<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Image Text Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Free stack -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script async src="https://docs.opencv.org/4.10.0/opencv.js"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; }
  canvas { max-width: 100%; }
  .loader { border: 3px solid #e2e8f0; border-top: 3px solid #0d9488; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-slate-100 text-slate-900">

<div class="max-w-2xl mx-auto min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-2 font-bold">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.1 2.1 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Image Text Editor
    </div>
    <button id="newBtn" class="text-sm font-semibold text-teal-600">New image</button>
    <input type="file" id="file" accept="image/*" class="hidden" />
  </header>

  <!-- Empty state -->
  <div id="empty" class="flex-1 flex flex-col items-center justify-center text-center p-8">
    <div class="w-16 h-16 bg-teal-50 rounded-2xl flex items-center justify-center mb-4">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </div>
    <h2 class="text-xl font-bold mb-1">Edit text in any image</h2>
    <p class="text-slate-500 text-sm max-w-xs mb-5">Upload an image. Text is auto-detected — tap any text to erase it or rewrite it. Background is restored automatically.</p>
    <button id="pickBtn" class="bg-teal-600 text-white font-semibold px-6 py-3 rounded-xl">Choose Image</button>
    <p class="text-[11px] text-slate-400 mt-3">100% free · runs in your browser · Fabric.js + Tesseract + OpenCV</p>
  </div>

  <!-- Editor -->
  <div id="editor" class="hidden flex-1 flex flex-col">
    <!-- Toolbar -->
    <div class="bg-white border-b border-slate-200 px-3 py-2 flex items-center gap-2">
      <button id="scanBtn" class="bg-teal-600 text-white text-sm font-semibold px-4 py-2 rounded-lg flex items-center gap-1.5">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10"/></svg>
        Scan Text
      </button>
      <span id="status" class="text-xs text-slate-500 ml-auto"></span>
    </div>

    <!-- Canvas -->
    <div class="bg-slate-900 flex-1 flex items-center justify-center p-3 overflow-auto">
      <div id="canvasWrap" class="inline-block"></div>
    </div>

    <!-- Bottom panel (shown when a text block is selected) -->
    <div id="panel" class="hidden bg-white border-t border-slate-200 p-3 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-teal-600">Editing selected text</span>
        <button id="deselectBtn" class="text-xs text-slate-400">Done</button>
      </div>
      <textarea id="newText" rows="2" placeholder="Type new text (leave empty to just erase)" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm resize-none focus:outline-none focus:ring-2 focus:ring-teal-500/30"></textarea>
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="text-[10px] font-semibold text-slate-500 block mb-1">Size <span id="sizeVal" class="text-teal-600">24</span></label>
          <input id="size" type="range" min="8" max="120" value="24" class="w-full accent-teal-600" />
        </div>
        <div>
          <label class="text-[10px] font-semibold text-slate-500 block mb-1">Color</label>
          <input id="color" type="color" value="#111111" class="w-full h-8 rounded-lg border border-slate-200" />
        </div>
        <div>
          <label class="text-[10px] font-semibold text-slate-500 block mb-1">Font</label>
          <select id="font" class="w-full px-1 py-1.5 border border-slate-200 rounded-lg text-xs">
            <option>Arial</option><option>Georgia</option><option>Times New Roman</option><option>Courier New</option><option>Verdana</option><option>Impact</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button id="removeBtn" class="bg-red-50 text-red-600 font-semibold py-2.5 rounded-lg text-sm">Erase only</button>
        <button id="applyBtn" class="bg-teal-600 text-white font-semibold py-2.5 rounded-lg text-sm">Erase & write</button>
      </div>
    </div>

    <!-- Export -->
    <div class="bg-white border-t border-slate-200 p-3 grid grid-cols-2 gap-2">
      <button id="jpgBtn" class="bg-slate-100 text-slate-600 font-semibold py-2.5 rounded-lg text-sm">JPG</button>
      <button id="pngBtn" class="bg-teal-600 text-white font-semibold py-2.5 rounded-lg text-sm">PNG</button>
    </div>
  </div>
</div>

<script>
// ============ STATE ============
let fabricCanvas = null;
let bgCanvas = null;          // offscreen canvas holding current image (natural size, capped)
let naturalScale = 1;         // bgCanvas is naturalSize * naturalScale
let regions = [];             // [{text, bbox:{x,y,w,h}}]
let rectObjs = [];            // fabric Rect objects
let selected = null;
let ocvReady = false;

// ============ OPENCV READY ============
function onOpenCvReady() { ocvReady = true; }
if (typeof cv !== 'undefined' && cv.Mat) { ocvReady = true; }
else {
  // poll for cv readiness
  const iv = setInterval(() => {
    if (typeof cv !== 'undefined' && cv.Mat) { ocvReady = true; clearInterval(iv); }
  }, 300);
}
function waitOpenCV() { return new Promise(res => { if (ocvReady) return res(); const c = setInterval(() => { if (ocvReady) { clearInterval(c); res(); } }, 200); }); }

// ============ FILE INPUT ============
const fileInput = document.getElementById('file');
document.getElementById('newBtn').onclick = () => fileInput.click();
document.getElementById('pickBtn').onclick = () => fileInput.click();
fileInput.onchange = (e) => { const f = e.target.files[0]; if (f) loadImage(f); };

function setStatus(t) { document.getElementById('status').textContent = t; }

// ============ LOAD IMAGE ============
function loadImage(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => initEditor(img);
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function initEditor(img) {
  // cap size for performance
  const MAX = 1500;
  naturalScale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * naturalScale);
  const h = Math.round(img.naturalHeight * naturalScale);

  // offscreen background canvas
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = w; bgCanvas.height = h;
  bgCanvas.getContext('2d').drawImage(img, 0, 0, w, h);

  // fabric canvas
  document.getElementById('canvasWrap').innerHTML = '<canvas id="c"></canvas>';
  fabricCanvas = new fabric.Canvas('c', { selection: false, width: w, height: h });
  fabricCanvas.setBackgroundColor({ source: bgCanvas.toDataURL(), repeat: 'no-repeat' }, () => fabricCanvas.renderAll());

  regions = []; rectObjs = []; selected = null;
  document.getElementById('empty').classList.add('hidden');
  document.getElementById('editor').classList.remove('hidden');
  document.getElementById('panel').classList.add('hidden');
  setStatus('Ready. Click "Scan Text".');
}

// ============ SCAN (TESSERACT) ============
document.getElementById('scanBtn').onclick = scan;

async function scan() {
  if (!bgCanvas) return;
  setStatus('Scanning…');
  // upsample for OCR
  const up = document.createElement('canvas');
  const s = Math.max(1, 1600 / Math.max(bgCanvas.width, bgCanvas.height));
  up.width = bgCanvas.width * s; up.height = bgCanvas.height * s;
  up.getContext('2d').drawImage(bgCanvas, 0, 0, up.width, up.height);
  try {
    const { data } = await Tesseract.recognize(up, 'eng', {
      logger: m => { if (m.status === 'recognizing text') setStatus('Scanning ' + Math.round(m.progress * 100) + '%'); },
    });
    const words = data.words || [];
    regions = words
      .filter(w => w.text && w.text.trim() && w.confidence > 30)
      .map(w => ({ text: w.text.trim(), bbox: { x: w.bbox.x0 / s, y: w.bbox.y0 / s, w: (w.bbox.x1 - w.bbox.x0) / s, h: (w.bbox.y1 - w.bbox.y0) / s } }));
    drawRects();
    setStatus(regions.length ? regions.length + ' text blocks — tap one' : 'No text found. Try a clearer image.');
  } catch (e) {
    setStatus('Scan failed: ' + e.message);
  }
}

function drawRects() {
  rectObjs.forEach(r => fabricCanvas.remove(r));
  rectObjs = [];
  regions.forEach((reg, i) => {
    const rect = new fabric.Rect({
      left: reg.bbox.x, top: reg.bbox.y, width: reg.bbox.w, height: reg.bbox.h,
      fill: i === selected ? 'rgba(13,148,136,0.15)' : 'rgba(13,148,136,0.03)',
      stroke: i === selected ? '#0d9488' : 'rgba(13,148,136,0.6)',
      strokeWidth: i === selected ? 3 : 1.5,
      strokeDashArray: i === selected ? null : [5, 4],
      selectable: false, hoverCursor: 'pointer', _idx: i,
    });
    rect.on('mousedown', () => selectRegion(i));
    fabricCanvas.add(rect);
    rectObjs.push(rect);
  });
}

function selectRegion(i) {
  selected = i;
  drawRects();
  document.getElementById('newText').value = regions[i].text;
  document.getElementById('panel').classList.remove('hidden');
}

document.getElementById('deselectBtn').onclick = () => { selected = null; drawRects(); document.getElementById('panel').classList.add('hidden'); };

// ============ OPENCV INPAINT (erase a bbox region on bgCanvas) ============
async function inpaintRegion(bbox, pad = 6) {
  await waitOpenCV();
  const src = cv.imread(bgCanvas);
  const mask = cv.Mat.zeros(src.rows, src.cols, cv.CV_8UC1);
  const x0 = Math.max(0, Math.floor(bbox.x - pad)), y0 = Math.max(0, Math.floor(bbox.y - pad));
  const x1 = Math.min(src.cols, Math.ceil(bbox.x + bbox.w + pad)), y1 = Math.min(src.rows, Math.ceil(bbox.y + bbox.h + pad));
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) mask.ucharPtr(y, x)[0] = 255;
  const dst = new cv.Mat();
  const radius = Math.max(3, Math.round(Math.min(x1 - x0, y1 - y0) * 0.4));
  cv.inpaint(src, mask, dst, radius, cv.INPAINT_TELEA);
  cv.imshow(bgCanvas, dst);
  src.delete(); mask.delete(); dst.delete();
}

function reloadBackground() {
  return new Promise(res => {
    fabricCanvas.setBackgroundColor({ source: bgCanvas.toDataURL(), repeat: 'no-repeat' }, () => { fabricCanvas.renderAll(); res(); });
  });
}

// ============ REMOVE ============
document.getElementById('removeBtn').onclick = async () => {
  if (selected === null) return;
  setStatus('Erasing…');
  await inpaintRegion(regions[selected].bbox);
  await reloadBackground();
  regions.splice(selected, 1);
  selected = null;
  drawRects();
  document.getElementById('panel').classList.add('hidden');
  setStatus('Erased. Edit another or download.');
};

// ============ APPLY (erase + write new text) ============
document.getElementById('applyBtn').onclick = async () => {
  if (selected === null) return;
  const reg = regions[selected];
  const txt = document.getElementById('newText').value;
  setStatus('Erasing…');
  await inpaintRegion(reg.bbox);
  await reloadBackground();
  if (txt.trim()) {
    const size = parseInt(document.getElementById('size').value, 10);
    const color = document.getElementById('color').value;
    const font = document.getElementById('font').value;
    const tb = new fabric.Textbox(txt, {
      left: reg.bbox.x, top: reg.bbox.y + reg.bbox.h / 2,
      width: reg.bbox.w, fontSize: size, fill: color, fontFamily: font,
      textAlign: 'center', originY: 'center', editable: false, selectable: true,
    });
    fabricCanvas.add(tb);
  }
  regions.splice(selected, 1);
  selected = null;
  drawRects();
  document.getElementById('panel').classList.add('hidden');
  setStatus('Done. Edit another or download.');
};

// ============ CONTROLS ============
document.getElementById('size').oninput = e => document.getElementById('sizeVal').textContent = e.target.value;

// ============ EXPORT ============
document.getElementById('pngBtn').onclick = () => exportImg('png');
document.getElementById('jpgBtn').onclick = () => exportImg('jpeg');
function exportImg(type) {
  if (!fabricCanvas) return;
  // deselect rects for clean export
  const prev = selected; selected = null; drawRects();
  setTimeout(() => {
    const url = fabricCanvas.toDataURL({ format: type, multiplier: 2 });
    const a = document.createElement('a');
    a.href = url; a.download = 'edited.' + (type === 'png' ? 'png' : 'jpg'); a.click();
    selected = prev; drawRects();
  }, 80);
}
</script>
</body>
</html>
