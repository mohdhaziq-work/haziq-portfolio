<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="512" height="512" rx="108" fill="url(#shine)"/>
  <!-- H letter - custom designed with geometric cuts -->
  <g fill="white">
    <!-- Left vertical bar -->
    <rect x="120" y="100" width="72" height="312" rx="8"/>
    <!-- Right vertical bar -->
    <rect x="320" y="100" width="72" height="312" rx="8"/>
    <!-- Horizontal connector -->
    <rect x="192" y="210" width="128" height="64" rx="8"/>
    <!-- Top left accent dot -->
    <circle cx="120" cy="100" r="16" fill="white" opacity="0.4"/>
  </g>
  <!-- Subtle shadow under H -->
  <g opacity="0.15">
    <rect x="126" y="412" width="60" height="8" rx="4" fill="black"/>
    <rect x="326" y="412" width="60" height="8" rx="4" fill="black"/>
  </g>
</svg>
